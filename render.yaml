services:
  - type: web
    name: mediscan-guardian-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://mediscan-medical-image-diagnostic-a-nine.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.0"
    plan: free
